spring:
  application:
    name: autoflow-api

  # Datasource is defined per profile (see application-local.yml). Tests get their
  # datasource dynamically from Testcontainers (@ServiceConnection).

  jpa:
    hibernate:
      # Never let Hibernate create/alter the schema. Flyway owns the schema.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Only expose safe endpoints for now.
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: autoflow-api
    description: Digital workshop system for car repair shops

autoflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      # Must be at least 32 bytes for HS256. Override in production via JWT_SECRET.
      secret: ${JWT_SECRET:dev-secret-change-me-please-0123456789-abcdefghijklmnop}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    admin:
      username: ${AUTOFLOW_SECURITY_ADMIN_USERNAME:admin}
      password: ${AUTOFLOW_SECURITY_ADMIN_PASSWORD:admin123}
  vegvesen:
    # Public Statens Vegvesen registration lookup API (no authentication required).
    # Replace with the authenticated akfell-datautlevering endpoint when
    # Maskinporten credentials are available.
    lookup-url: ${VEGVESEN_LOOKUP_URL:https://kjoretoyoppslag.atlas.vegvesen.no/kjennemerke}
